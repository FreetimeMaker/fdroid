name: Update F-Droid repository on main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fdroid-main
  cancel-in-progress: false

jobs:
  update-repository:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[fdroid-generated]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install F-Droid server tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install fdroidserver

      - name: Install Android SDK Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apksigner android-sdk-build-tools

          if ! command -v apksigner >/dev/null 2>&1; then
            APKSIGNER_PATH="$(find /usr/lib/android-sdk/build-tools -type f -name apksigner | sort -V | tail -n1)"
            test -n "$APKSIGNER_PATH"
            sudo ln -sf "$APKSIGNER_PATH" /usr/bin/apksigner
          fi

          apksigner version

      - name: Set up gradlew-fdroid
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/gradlew-fdroid
          sudo git clone --depth 1 https://gitlab.com/fdroid/gradlew-fdroid.git /opt/gradlew-fdroid
          sudo chmod +x /opt/gradlew-fdroid/gradlew-fdroid
          sed -i 's#^gradle:.*#gradle: /opt/gradlew-fdroid/gradlew-fdroid#' config.yml
          test -x /opt/gradlew-fdroid/gradlew-fdroid

      - name: Get KeyStore
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.KEYSTORE_REPOSITORY }}
          token: ${{ secrets.KEYSTORE_ACCESS_TOKEN }}
          path: temp_secrets

      - name: Copy KeyStore
        shell: bash
        run: |
          set -euo pipefail
          cp temp_secrets/keystore.p12 ./keystore.p12
          rm -rf temp_secrets

      - name: Run fdroid.sh on main
        shell: bash
        env:
          RUN_FDROID_MAIN: "true"
        run: |
          set -euo pipefail
          chmod +x ./fdroid.sh
          bash ./fdroid.sh

      - name: Restore temporary config and remove secrets
        if: always()
        shell: bash
        run: |
          git checkout -- config.yml || true
          rm -f keystore.p12
          sudo rm -rf /opt/gradlew-fdroid

      - name: Commit generated repository files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "freetimemaker-fdroid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No generated repository changes to commit."
            exit 0
          fi

          git commit -m "Update F-Droid repository [fdroid-generated]"
          git push origin HEAD:main
