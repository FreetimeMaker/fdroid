name: Build F-Droid Repo & Publish to free-time.me

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:

  build_fdroid:
    name: "Build F-Droid Repo"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout Keystore Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.KEYSTORE_REPOSITORY }}
          token: ${{ secrets.KEYSTORE_ACCESS_TOKEN }}
          path: temp_secrets

      # ---------------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------------

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget unzip imagemagick aapt yq apksigner zipalign

      - name: Install fdroidserver
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install fdroidserver androguard==4.1.1

      - name: Set up repo secrets
        run: |
          cp -r temp_secrets/. fdroid/
          rm -rf temp_secrets
          sed -i 's|apksigner: .*|apksigner: /usr/bin/apksigner|' fdroid/config.yml
          chmod 0600 fdroid/config.yml
          [ -f fdroid/keystore.p12 ] && chmod 0600 fdroid/keystore.p12

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '^1.17.0'

      - name: Run update script
        run: bash update.sh 2>&1
        env:
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

      # ---------------------------------------------------------
      # Publish to free-time.me (Vercel Blob)
      # ---------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install upload deps
        run: npm install @vercel/blob

      - name: Upload repo to Vercel Blob
        run: node .github/scripts/upload-to-blob.js
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}