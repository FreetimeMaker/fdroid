name: Auto-update existing F-Droid apps

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fdroid-auto-update
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install F-Droid server tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fdroidserver==2.4.5"

      - name: Collect existing apps
        id: apps
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t METADATA_FILES < <(find metadata -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)

          if [ "${#METADATA_FILES[@]}" -eq 0 ]; then
            echo "No existing apps found in metadata/."
            echo "has_apps=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${METADATA_FILES[@]}" > /tmp/metadata-before.txt

          APP_IDS=()
          for file in "${METADATA_FILES[@]}"; do
            APP_IDS+=("${file%.yml}")
          done

          printf '%s\n' "${APP_IDS[@]}" > /tmp/app-ids.txt
          echo "has_apps=true" >> "$GITHUB_OUTPUT"
          echo "Found ${#APP_IDS[@]} existing app(s): ${APP_IDS[*]}"

      - name: Check existing apps for updates
        if: steps.apps.outputs.has_apps == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APP_IDS < /tmp/app-ids.txt

          # --autoonly restricts processing to apps that already opted into
          # F-Droid auto updates. Passing explicit existing app IDs ensures this
          # workflow can never discover/add a new app on its own.
          fdroid checkupdates --auto --autoonly --allow-dirty "${APP_IDS[@]}"

      - name: Ensure no new app metadata was added
        if: steps.apps.outputs.has_apps == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find metadata -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort > /tmp/metadata-after.txt

          if ! diff -u /tmp/metadata-before.txt /tmp/metadata-after.txt; then
            echo "::error::The update process changed the set of app metadata files. New or removed apps are not allowed."
            exit 1
          fi

      - name: Detect metadata changes
        if: steps.apps.outputs.has_apps == 'true'
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- 'metadata/*.yml'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No app updates found."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          git diff --name-only -- 'metadata/*.yml' \
            | sed -n 's#^metadata/\(.*\)\.yml$#\1#p' \
            | sort -u > /tmp/updated-apps.txt

          echo "Updated apps:"
          cat /tmp/updated-apps.txt

      - name: Validate updated metadata
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t UPDATED_APPS < /tmp/updated-apps.txt

          fdroid readmeta
          fdroid lint "${UPDATED_APPS[@]}"

      - name: Run fdroid-bot.sh
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash ./fdroid-bot.sh

      - name: Push bot branch
        if: steps.changes.outputs.changed == 'true'
        id: push
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="bot/fdroid-auto-update"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name "freetimemaker-fdroid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -A

          if git diff --cached --quiet; then
            echo "::error::The update check reported changes, but there is nothing to commit after fdroid-bot.sh."
            exit 1
          fi

          git commit -m "Auto-update F-Droid apps"
          git push --force-with-lease origin "$BRANCH"

      - name: Build pull request title and body
        if: steps.changes.outputs.changed == 'true'
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t UPDATED_APPS < /tmp/updated-apps.txt

          if [ "${#UPDATED_APPS[@]}" -eq 1 ]; then
            APP_ID="${UPDATED_APPS[0]}"
            VERSION="$(sed -n 's/^CurrentVersion:[[:space:]]*//p' "metadata/$APP_ID.yml" | tail -n1)"
            TITLE="Update $APP_ID to $VERSION"
          else
            TITLE="Update ${#UPDATED_APPS[@]} F-Droid apps"
          fi

          {
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            echo "## Automatic F-Droid update"
            echo
            echo "This pull request was generated automatically after checking only apps already present in \`metadata/\`."
            echo
            echo "### Updated apps"
            echo
            for APP_ID in "${UPDATED_APPS[@]}"; do
              VERSION="$(sed -n 's/^CurrentVersion:[[:space:]]*//p' "metadata/$APP_ID.yml" | tail -n1)"
              VERSION_CODE="$(sed -n 's/^CurrentVersionCode:[[:space:]]*//p' "metadata/$APP_ID.yml" | tail -n1)"
              echo "- \`$APP_ID\` → **$VERSION** (versionCode \`$VERSION_CODE\`)"
            done
            echo
            echo "### Checks performed"
            echo
            echo "- F-Droid update check ran with \`--auto --autoonly\` for explicit existing app IDs."
            echo "- The workflow verified that no metadata file was added or removed."
            echo "- \`fdroid readmeta\` completed successfully."
            echo "- \`fdroid lint\` completed successfully for every updated app."
            echo "- \`fdroid-bot.sh\` completed successfully before these changes were pushed."
            echo
            echo "Generated by GitHub Actions workflow: \`${GITHUB_WORKFLOW}\`."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY: ${{ steps.pr.outputs.body }}
          HEAD_BRANCH: ${{ steps.push.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          EXISTING_PR="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$HEAD_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
            echo "Updated existing PR #$EXISTING_PR."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "${GITHUB_REF_NAME:-main}" \
              --head "$HEAD_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi
