name: Auto-update existing F-Droid apps

on:
  push:
    branches:
      - '**'
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fdroid-auto-update
  cancel-in-progress: false

jobs:

  collect-apps:
    name: Collect existing apps
    runs-on: ubuntu-latest

    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      has_apps: ${{ steps.apps.outputs.has_apps }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Collect existing apps
        id: apps
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t METADATA_FILES < <(
            find metadata \
              -maxdepth 1 \
              -type f \
              -name '*.yml' \
              -printf '%f\n' \
              | sort
          )

          if [ "${#METADATA_FILES[@]}" -eq 0 ]; then
            echo "No existing apps found."

            echo 'apps=[]' >> "$GITHUB_OUTPUT"
            echo 'has_apps=false' >> "$GITHUB_OUTPUT"

            exit 0
          fi

          APP_IDS=()

          for FILE in "${METADATA_FILES[@]}"; do
            APP_IDS+=("${FILE%.yml}")
          done

          APPS_JSON="$(
            printf '%s\n' "${APP_IDS[@]}" \
              | jq -Rsc \
              'split("\n") | map(select(length > 0))'
          )"

          echo "apps=$APPS_JSON" >> "$GITHUB_OUTPUT"
          echo "has_apps=true" >> "$GITHUB_OUTPUT"

          echo "Found apps:"

          printf ' - %s\n' "${APP_IDS[@]}"

  update-app:
    name: Check ${{ matrix.app }}

    needs:
      - collect-apps

    if: needs.collect-apps.outputs.has_apps == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        app: ${{ fromJSON(needs.collect-apps.outputs.apps) }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install F-Droid server tools
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "fdroidserver"

      - name: Install Android SDK Build Tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            apksigner \
            android-sdk-build-tools

          if ! command -v apksigner >/dev/null 2>&1; then
            APKSIGNER_PATH="$(find /usr/lib/android-sdk/build-tools -type f -name apksigner | sort -V | tail -n1)"

            if [ -z "$APKSIGNER_PATH" ]; then
              echo "::error::apksigner could not be found after installing Android SDK Build Tools."
              exit 1
            fi

            sudo ln -sf "$APKSIGNER_PATH" /usr/bin/apksigner
          fi

          echo "Using apksigner: $(command -v apksigner)"
          apksigner version

      - name: Set up gradlew-fdroid
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /opt/gradlew-fdroid
          sudo git clone --depth 1 \
            https://gitlab.com/fdroid/gradlew-fdroid.git \
            /opt/gradlew-fdroid

          sudo chmod +x /opt/gradlew-fdroid/gradlew-fdroid

          sed -i \
            's#^gradle:.*#gradle: /opt/gradlew-fdroid/gradlew-fdroid#' \
            config.yml

          echo "Configured Gradle wrapper:"
          grep '^gradle:' config.yml

          test -x /opt/gradlew-fdroid/gradlew-fdroid

      - name: Save metadata file list
        shell: bash
        run: |
          set -euo pipefail

          find metadata \
            -maxdepth 1 \
            -type f \
            -name '*.yml' \
            -printf '%f\n' \
            | sort \
            > /tmp/metadata-before.txt

      - name: Getting KeyStore
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.KEYSTORE_REPOSITORY }}
          token: ${{ secrets.KEYSTORE_ACCESS_TOKEN }}
          path: temp_secrets

      - name: Copy KeyStore to Root Dir
        run: |
          cp -r temp_secrets/keystore.p12 ./
          rm -rf temp_secrets

      - name: Check app for update
        shell: bash
        env:
          APP_ID: ${{ matrix.app }}
        run: |
          set -euo pipefail

          echo "Checking:"
          echo "$APP_ID"

          fdroid checkupdates \
            --auto \
            --autoonly \
            --allow-dirty \
            "$APP_ID"

      - name: Ensure no apps were added or removed
        shell: bash
        run: |
          set -euo pipefail

          find metadata \
            -maxdepth 1 \
            -type f \
            -name '*.yml' \
            -printf '%f\n' \
            | sort \
            > /tmp/metadata-after.txt

          if ! diff \
            -u \
            /tmp/metadata-before.txt \
            /tmp/metadata-after.txt
          then
            echo "::error::App metadata files changed."
            echo "::error::Adding/removing apps is not allowed."

            exit 1
          fi

      - name: Detect update
        id: update
        shell: bash
        env:
          APP_ID: ${{ matrix.app }}
        run: |
          set -euo pipefail

          if git diff \
            --quiet \
            -- "metadata/$APP_ID.yml"
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "No update for $APP_ID."

            exit 0
          fi

          VERSION="$(
            sed -n \
              's/^CurrentVersion:[[:space:]]*//p' \
              "metadata/$APP_ID.yml" \
              | tail -n1
          )"

          VERSION_CODE="$(
            sed -n \
              's/^CurrentVersionCode:[[:space:]]*//p' \
              "metadata/$APP_ID.yml" \
              | tail -n1
          )"

          echo "changed=true" >> "$GITHUB_OUTPUT"

          echo "version=$VERSION" \
            >> "$GITHUB_OUTPUT"

          echo "version_code=$VERSION_CODE" \
            >> "$GITHUB_OUTPUT"

          echo
          echo "================================"
          echo "Update found"
          echo "================================"
          echo "App:         $APP_ID"
          echo "Version:     $VERSION"
          echo "VersionCode: $VERSION_CODE"

          git diff \
            -- "metadata/$APP_ID.yml"

      - name: Run fdroid-bot.sh
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          APP_ID: ${{ matrix.app }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          chmod +x ./fdroid-bot.sh
          chmod +x ./changelogs.sh

          bash ./fdroid-bot.sh

          rm -rf keystore.p12

      - name: Create app branch
        if: steps.update.outputs.changed == 'true'
        id: branch
        shell: bash
        env:
          APP_ID: ${{ matrix.app }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail

          SAFE_APP="$(
            printf '%s' "$APP_ID" \
              | sed 's/[^A-Za-z0-9._-]/-/g'
          )"

          SAFE_VERSION="$(
            printf '%s' "$VERSION" \
              | sed 's/[^A-Za-z0-9._-]/-/g'
          )"

          BRANCH="bot/fdroid-auto-update/${SAFE_APP}-${SAFE_VERSION}"

          echo "branch=$BRANCH" \
            >> "$GITHUB_OUTPUT"

          echo "Branch:"
          echo "$BRANCH"

          git config \
            user.name \
            "freetimemaker-fdroid-bot"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout \
            -B \
            "$BRANCH"

          git add -A

          if git diff --cached --quiet; then
            echo "::error::Nothing to commit."
            exit 1
          fi

          git status

          git commit \
            -m "Update $APP_ID to $VERSION"

          git push \
            --force-with-lease \
            origin \
            "HEAD:$BRANCH"

      - name: Build pull request
        if: steps.update.outputs.changed == 'true'
        id: pr
        shell: bash
        env:
          APP_ID: ${{ matrix.app }}
          VERSION: ${{ steps.update.outputs.version }}
          VERSION_CODE: ${{ steps.update.outputs.version_code }}
        run: |
          set -euo pipefail

          TITLE="Update $APP_ID to $VERSION"

          {
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"

            echo "## Automatic F-Droid update"
            echo

            echo "This pull request was generated automatically."
            echo

            echo "### Updated app"
            echo

            echo "- App: \`$APP_ID\`"
            echo "- Version: **$VERSION**"
            echo "- versionCode: \`$VERSION_CODE\`"

            echo
            echo "### Checks performed"
            echo

            echo "- F-Droid update check ran with \`--auto --autoonly\`."
            echo "- Only \`$APP_ID\` was checked."
            echo "- No app metadata files were added or removed."
            echo "- \`fdroid readmeta\` completed successfully."
            echo "- \`fdroid lint $APP_ID\` completed successfully."
            echo "- \`changelogs.sh\` was run through \`fdroid-bot.sh\`."
            echo "- \`fdroid-bot.sh\` completed successfully."
            echo "- Final metadata validation completed successfully."

            echo
            echo "Generated by GitHub Actions workflow: \`${GITHUB_WORKFLOW}\`."

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY: ${{ steps.pr.outputs.body }}
          HEAD_BRANCH: ${{ steps.branch.outputs.branch }}

        run: |
          set -euo pipefail

          EXISTING_PR="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head "$HEAD_BRANCH" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$EXISTING_PR" ]; then

            echo "Updating PR #$EXISTING_PR..."

            gh pr edit \
              "$EXISTING_PR" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

          else

            echo "Creating pull request..."

            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "${GITHUB_REF_NAME:-main}" \
              --head "$HEAD_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

          fi

      - name: Clean up gradlew-fdroid
        if: always()
        shell: bash
        run: |
          sudo rm -rf /opt/gradlew-fdroid
