name: Auto-update existing F-Droid apps

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fdroid-auto-update
  cancel-in-progress: true

jobs:
  collect-apps:
    name: Collect existing apps
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      has_apps: ${{ steps.apps.outputs.has_apps }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Collect existing apps
        id: apps
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t METADATA_FILES < <(
            find metadata -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort
          )

          if [ "${#METADATA_FILES[@]}" -eq 0 ]; then
            echo 'apps=[]' >> "$GITHUB_OUTPUT"
            echo 'has_apps=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APP_IDS=()
          for FILE in "${METADATA_FILES[@]}"; do
            APP_IDS+=("${FILE%.yml}")
          done

          APPS_JSON="$(printf '%s\n' "${APP_IDS[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "apps=$APPS_JSON" >> "$GITHUB_OUTPUT"
          echo 'has_apps=true' >> "$GITHUB_OUTPUT"

  update-app:
    name: Check ${{ matrix.app }}
    needs: collect-apps
    if: github.event_name != 'push' && needs.collect-apps.outputs.has_apps == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.collect-apps.outputs.apps) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install F-Droid server tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install fdroidserver

      - name: Save metadata file list
        shell: bash
        run: |
          set -euo pipefail
          find metadata -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort > /tmp/metadata-before.txt

      - name: Check app for update
        shell: bash
        env:
          APP_ID: ${{ matrix.app }}
        run: |
          set -euo pipefail
          fdroid checkupdates --auto --autoonly --allow-dirty "$APP_ID"

      - name: Ensure no apps were added or removed
        shell: bash
        run: |
          set -euo pipefail
          find metadata -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort > /tmp/metadata-after.txt
          if ! diff -u /tmp/metadata-before.txt /tmp/metadata-after.txt; then
            echo "::error::Adding/removing app metadata is not allowed."
            exit 1
          fi

      - name: Detect update
        id: update
        shell: bash
        env:
          APP_ID: ${{ matrix.app }}
        run: |
          set -euo pipefail

          if git diff --quiet -- "metadata/$APP_ID.yml"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(sed -n 's/^CurrentVersion:[[:space:]]*//p' "metadata/$APP_ID.yml" | tail -n1)"
          VERSION_CODE="$(sed -n 's/^CurrentVersionCode:[[:space:]]*//p' "metadata/$APP_ID.yml" | tail -n1)"
          SOURCE_CODE="$(sed -n 's/^SourceCode:[[:space:]]*//p' "metadata/$APP_ID.yml" | tail -n1 | sed 's#/$##')"

          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "source_code=$SOURCE_CODE" >> "$GITHUB_OUTPUT"
          echo "Update found: $APP_ID -> $VERSION ($VERSION_CODE)"

      - name: Save update result
        shell: bash
        env:
          APP_ID: ${{ matrix.app }}
          CHANGED: ${{ steps.update.outputs.changed }}
          VERSION: ${{ steps.update.outputs.version }}
          VERSION_CODE: ${{ steps.update.outputs.version_code }}
          SOURCE_CODE: ${{ steps.update.outputs.source_code }}
        run: |
          set -euo pipefail
          mkdir -p update-result/metadata

          jq -n \
            --arg app_id "$APP_ID" \
            --arg changed "$CHANGED" \
            --arg version "$VERSION" \
            --arg version_code "$VERSION_CODE" \
            --arg source_code "$SOURCE_CODE" \
            '{app_id:$app_id,changed:($changed == "true"),version:$version,version_code:$version_code,source_code:$source_code}' \
            > update-result/result.json

          if [ "$CHANGED" = 'true' ]; then
            cp "metadata/$APP_ID.yml" "update-result/metadata/$APP_ID.yml"
          fi

      - name: Upload update result
        uses: actions/upload-artifact@v4
        with:
          name: update-result-${{ matrix.app }}
          path: update-result
          if-no-files-found: error
          retention-days: 1

  apply-updates:
    name: Apply app updates directly to main
    needs: update-app
    if: github.event_name != 'push' && needs.update-app.result == 'success'
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.apply.outputs.changed }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download update results
        uses: actions/download-artifact@v5
        with:
          pattern: update-result-*
          path: update-results

      - name: Apply metadata, changelog and README updates
        id: apply
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPDATED_COUNT=0

          while IFS= read -r RESULT_FILE; do
            [ "$(jq -r '.changed' "$RESULT_FILE")" = 'true' ] || continue

            APP_ID="$(jq -r '.app_id' "$RESULT_FILE")"
            VERSION="$(jq -r '.version' "$RESULT_FILE")"
            VERSION_CODE="$(jq -r '.version_code' "$RESULT_FILE")"
            SOURCE_CODE="$(jq -r '.source_code' "$RESULT_FILE" | sed 's#/$##')"
            RESULT_DIR="$(dirname "$RESULT_FILE")"

            cp "$RESULT_DIR/metadata/$APP_ID.yml" "metadata/$APP_ID.yml"
            chmod +x ./changelogs.sh
            ./changelogs.sh "$APP_ID"

            export SOURCE_CODE VERSION VERSION_CODE APP_ID
            python - <<'PY'
          import os
          from pathlib import Path

          readme = Path("README.md")
          source_code = os.environ["SOURCE_CODE"].rstrip("/")
          version = os.environ["VERSION"]
          version_code = os.environ["VERSION_CODE"]
          app_id = os.environ["APP_ID"]
          lines = readme.read_text(encoding="utf-8").splitlines(keepends=True)

          for index, line in enumerate(lines):
              if line.lstrip().startswith("|") and source_code in line:
                  cells = line.rstrip("\r\n").split("|")
                  if len(cells) < 6:
                      raise SystemExit(f"Unexpected README row for {app_id}")
                  cells[-2] = f" {version} ({version_code}) "
                  newline = "\r\n" if line.endswith("\r\n") else "\n"
                  lines[index] = "|".join(cells) + newline
                  break
          else:
              raise SystemExit(f"Could not find README row for {app_id}: {source_code}")

          readme.write_text("".join(lines), encoding="utf-8")
          PY

            UPDATED_COUNT=$((UPDATED_COUNT + 1))
          done < <(find update-results -type f -name result.json | sort)

          if [ "$UPDATED_COUNT" -eq 0 ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit updates directly to main
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "freetimemaker-fdroid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata README.md

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update F-Droid apps [fdroid-auto-update]"
          git pull --rebase origin main
          git push origin HEAD:main

  update-repository:
    name: Update F-Droid repository on main
    needs: apply-updates
    if: >-
      ${{
        always() &&
        (
          (github.event_name == 'push' && !contains(github.event.head_commit.message, '[fdroid-generated]')) ||
          needs.apply-updates.outputs.changed == 'true'
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install F-Droid server tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install fdroidserver

      - name: Configure real Android SDK and accept licenses
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Real Android sdkmanager was not found below $SDK_ROOT/cmdline-tools."
            exit 1
          fi

          echo "Android SDK root: $SDK_ROOT"
          echo "Android sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          LICENSE_STATUS="${PIPESTATUS[1]}"
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::Android sdkmanager --licenses failed with exit code $LICENSE_STATUS."
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-37" \
            "ndk;28.0.13004108"

          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not installed at $APKSIGNER"
            exit 1
          fi

          sudo ln -sf "$APKSIGNER" /usr/bin/apksigner

          sed -i "s#^sdk_path:.*#sdk_path: $SDK_ROOT#" config.yml
          sed -i "s#^[[:space:]]*r28c:.*#  r28c: $SDK_ROOT/ndk/28.0.13004108#" config.yml
          sed -i 's#^apksigner:.*#apksigner: /usr/bin/apksigner#' config.yml

          echo "Runtime F-Droid Android configuration:"
          grep -E '^(sdk_path|apksigner):|^[[:space:]]+r28c:' config.yml
          apksigner version

      - name: Set up gradlew-fdroid
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/gradlew-fdroid
          sudo git clone --depth 1 https://gitlab.com/fdroid/gradlew-fdroid.git /opt/gradlew-fdroid
          sudo chmod +x /opt/gradlew-fdroid/gradlew-fdroid
          sed -i 's#^gradle:.*#gradle: /opt/gradlew-fdroid/gradlew-fdroid#' config.yml
          test -x /opt/gradlew-fdroid/gradlew-fdroid

      - name: Get KeyStore
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.KEYSTORE_REPOSITORY }}
          token: ${{ secrets.KEYSTORE_ACCESS_TOKEN }}
          path: temp_secrets

      - name: Copy KeyStore
        shell: bash
        run: |
          set -euo pipefail
          cp temp_secrets/keystore.p12 ./keystore.p12
          rm -rf temp_secrets

      - name: Update F-Droid Repo
        shell: bash
        env:
          RUN_FDROID_MAIN: "true"
        run: |
          set -euo pipefail
          chmod +x ./fdroid-bot.sh
          bash ./fdroid-bot.sh

      - name: Restore temporary config and remove secrets
        if: always()
        shell: bash
        run: |
          git checkout -- config.yml || true
          rm -f keystore.p12
          sudo rm -rf /opt/gradlew-fdroid

      - name: Commit generated repository files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "freetimemaker-fdroid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No generated repository changes to commit."
            exit 0
          fi

          git commit -m "Update F-Droid repository [fdroid-generated]"
          git pull --rebase origin main
          git push origin HEAD:main
