title: Freetime Repository
description: Official F-Droid repository from Freetime Maker

# The fdroidserver-generated page under /repo/ (index.html, index.css, index.png,
# icons/, ...) is served by Jekyll verbatim as static content. Because all asset
# paths inside index.html are relative, they resolve correctly at that location.
#
# Only the website-relevant content is deployed. fdroidserver source files
# (metadata/, config.yml) and the former Next.js static dir (public/) are excluded.
exclude:
  - public
  - metadata
  - config.yml
