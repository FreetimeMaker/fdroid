title: Freetime Repository
description: Official F-Droid repository from Freetime Maker

# The fdroidserver-generated page under /repo/ (index.html, index.css, index.png,
# icons/, ...) is served by Jekyll verbatim as static content. Because all asset
# paths inside index.html are relative, they resolve correctly at that location.
#
# Everything listed here is excluded from the deployed _site. In particular this
# keeps fdroidserver source files, build outputs and signing secrets out of the
# public website. The signing secrets are additionally removed in the CI workflow
# before Jekyll runs, but excluding them here adds a safety net for local builds.
exclude:
  - .github
  - .git
  - build
  - logs
  - public
  - metadata
  - config.yml
  - repo/status
  - repo/*.log.gz
  - Gemfile
  - Gemfile.lock
  - node_modules
  - keystore.p12
  - GeoWeather-KeyStore.jks
  - Dualist-KeyStore.jks
  - SuperSMP-Companion-KeyStore.jks
  - SolWidth-KeyStore.jks
